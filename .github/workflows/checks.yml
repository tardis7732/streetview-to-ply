name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_release.py
      - name: GUI and PLY contracts (no provider download or model inference)
        run: >-
          python -m pytest
          tools/streetview_app/tests/test_server.py
          tools/streetview_app/tests/test_selection.py
          tools/streetview_app/tests/test_provider.py
          tools/streetview_app/tests/test_workflow_api.py
          tools/streetview_engine/tests/test_size_filter.py
